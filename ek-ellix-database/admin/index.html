<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EK ELLIX — Content Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23081426'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='sans-serif' font-size='48' font-weight='bold' fill='%230A6CFF'%3EEK%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #081426; --navy-light: #0d1f3c; --slate: #1B2430;
      --blue: #0A6CFF; --blue-dim: rgba(10,108,255,0.15); --blue-hover: #0057D8;
      --silver: #C0C0C0; --white: #FFFFFF; --white80: rgba(255,255,255,0.8);
      --white50: rgba(255,255,255,0.5); --white20: rgba(255,255,255,0.2);
      --white10: rgba(255,255,255,0.1); --white05: rgba(255,255,255,0.05);
      --green: #22c55e; --red: #ef4444; --orange: #f59e0b;
      --radius: 12px; --radius-sm: 8px; --radius-full: 9999px;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html { font-size: 15px; }
    body { font-family: var(--font); background: var(--navy); color: var(--white); line-height: 1.6; min-height: 100vh; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Layout */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px; background: var(--slate); border-right: 1px solid var(--white10);
      padding: 1.5rem 1rem; flex-shrink: 0; display: flex; flex-direction: column; gap: 0.5rem;
      position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem; margin-bottom: 1.5rem; }
    .sidebar-brand span { font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em; }
    .sidebar-brand small { display: block; font-size: 0.7rem; color: var(--blue); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1rem; border-radius: var(--radius-sm);
      color: var(--white80); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.15s;
      border: none; background: none; width: 100%; text-align: left; font-family: var(--font);
    }
    .nav-item:hover { background: var(--white10); color: var(--white); }
    .nav-item.active { background: var(--blue-dim); color: var(--blue); font-weight: 600; }
    .nav-item .icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .nav-sep { height: 1px; background: var(--white10); margin: 0.75rem 0; }

    .main { flex: 1; margin-left: 240px; padding: 2rem; max-width: 1100px; }
    .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .main-header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
    .main-header p { color: var(--silver); font-size: 0.85rem; margin-top: 0.25rem; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.25rem;
      font-size: 0.85rem; font-weight: 600; font-family: var(--font); border: none;
      border-radius: var(--radius-full); cursor: pointer; transition: all 0.15s;
      white-space: nowrap; min-height: 40px;
    }
    .btn-primary { background: var(--blue); color: var(--white); }
    .btn-primary:hover { background: var(--blue-hover); }
    .btn-secondary { background: var(--white10); color: var(--white); }
    .btn-secondary:hover { background: var(--white20); }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--red); }
    .btn-danger:hover { background: var(--red); color: var(--white); }
    .btn-success { background: rgba(34,197,94,0.15); color: var(--green); }
    .btn-success:hover { background: var(--green); color: var(--white); }
    .btn-sm { padding: 0.4rem 0.9rem; font-size: 0.78rem; min-height: 32px; }

    /* Cards / Entry List */
    .entry-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .entry-card {
      background: var(--slate); border: 1px solid var(--white10); border-radius: var(--radius);
      padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; transition: all 0.15s;
    }
    .entry-card:hover { border-color: var(--blue); transform: translateX(2px); }
    .entry-thumb {
      width: 56px; height: 56px; border-radius: var(--radius-sm); overflow: hidden; flex-shrink: 0;
      background: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .entry-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .entry-info { flex: 1; min-width: 0; }
    .entry-info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-info span { font-size: 0.75rem; color: var(--silver); }
    .entry-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .badge { padding: 0.2rem 0.6rem; border-radius: var(--radius-full); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge-free { background: rgba(34,197,94,0.2); color: var(--green); }
    .badge-featured { background: var(--blue-dim); color: var(--blue); }

    /* Modal / Form */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(8,20,38,0.85); backdrop-filter: blur(10px);
      z-index: 500; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--slate); border: 1px solid var(--white20); border-radius: var(--radius);
      width: 90%; max-width: 640px; max-height: 90vh; overflow-y: auto; padding: 2rem;
    }
    .modal h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group.full { grid-column: 1 / -1; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--white80); }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 0.65rem 0.85rem; background: var(--navy); border: 1px solid var(--white10);
      border-radius: var(--radius-sm); color: var(--white); font-family: var(--font); font-size: 0.88rem;
      outline: none; transition: border-color 0.15s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--blue); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-select option { background: var(--navy); }
    .form-hint { font-size: 0.7rem; color: var(--white50); margin-top: 0.25rem; }
    .form-checkbox { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; cursor: pointer; }
    .form-checkbox input { width: 18px; height: 18px; accent-color: var(--blue); }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--white10); }

    /* Tags input */
    .tags-input { display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0.5rem; background: var(--navy); border: 1px solid var(--white10); border-radius: var(--radius-sm); min-height: 42px; align-items: center; cursor: text; }
    .tags-input:focus-within { border-color: var(--blue); }
    .tags-input .tag { padding: 0.2rem 0.6rem; background: var(--blue-dim); border: 1px solid rgba(10,108,255,0.3); border-radius: var(--radius-full); font-size: 0.72rem; color: var(--blue); font-weight: 600; display: flex; align-items: center; gap: 0.3rem; }
    .tags-input .tag .remove { cursor: pointer; opacity: 0.7; font-size: 0.9rem; }
    .tags-input .tag .remove:hover { opacity: 1; }
    .tags-input input { border: none; background: none; color: var(--white); font-family: var(--font); font-size: 0.85rem; outline: none; flex: 1; min-width: 80px; }

    /* Toast */
    .toast-container { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 999; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { padding: 0.75rem 1.25rem; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; animation: slideIn 0.3s ease; }
    .toast-success { background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
    .toast-error { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); color: var(--red); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* Stats */
    .stats-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat-box { background: var(--slate); border: 1px solid var(--white10); border-radius: var(--radius-sm); padding: 1rem 1.5rem; flex: 1; min-width: 140px; }
    .stat-box .num { font-size: 1.5rem; font-weight: 800; color: var(--blue); }
    .stat-box .lbl { font-size: 0.75rem; color: var(--silver); margin-top: 0.15rem; }

    /* Empty state */
    .empty-state { text-align: center; padding: 3rem; color: var(--silver); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .empty-state p { font-size: 0.9rem; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 60px; padding: 1rem 0.5rem; align-items: center; }
      .sidebar-brand span, .sidebar-brand small, .nav-item span:not(.icon) { display: none; }
      .sidebar-brand { justify-content: center; }
      .nav-item { justify-content: center; padding: 0.7rem; }
      .main { margin-left: 60px; padding: 1.25rem; }
      .form-grid { grid-template-columns: 1fr; }
      .entry-card { flex-wrap: wrap; }
      .entry-actions { width: 100%; justify-content: flex-end; }
    }

    /* Sort handle */
    .sort-handle { cursor: grab; color: var(--white50); font-size: 1rem; padding: 0.25rem; }
    .sort-handle:active { cursor: grabbing; }

    /* Delete confirm */
    .confirm-bar { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius-sm); padding: 1rem; display: flex; align-items: center; gap: 1rem; margin-top: 0.5rem; }
    .confirm-bar p { flex: 1; font-size: 0.85rem; color: var(--red); }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span>🅴🅺</span>
        <div><span>Content Manager</span><small>Database Admin</small></div>
      </div>
      <button class="nav-item active" data-section="audio"><span class="icon">🎵</span><span>Audio / Beats</span></button>
      <button class="nav-item" data-section="videos"><span class="icon">🎬</span><span>Videos</span></button>
      <button class="nav-item" data-section="graphics"><span class="icon">🎨</span><span>Graphics</span></button>
      <button class="nav-item" data-section="testimonials"><span class="icon">⭐</span><span>Testimonials</span></button>
      <button class="nav-item" data-section="portfolio"><span class="icon">📷</span><span>Portfolio</span></button>
      <div class="nav-sep"></div>
      <button class="nav-item" id="btn-export-all"><span class="icon">📦</span><span>Export All</span></button>
      <button class="nav-item" id="btn-import"><span class="icon">📥</span><span>Import Data</span></button>
      <div class="nav-sep"></div>
      <a href="../index.html" class="nav-item"><span class="icon">🌐</span><span>View Site</span></a>
    </aside>

    <!-- Main Content -->
    <main class="main" id="main-content">
      <!-- Populated by admin.js -->
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Hidden file input for import -->
  <input type="file" id="import-file" accept=".json" style="display:none;" multiple>

  <script src="admin.js"></script>
</body>
</html>
